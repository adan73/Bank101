<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SafeBank Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="#">
Bank 911
</a>

<button class="btn btn-light">
Logout
</button>

</div>

</nav>


<div class="container mt-5">

<div class="row">

<div class="col-lg-4">

<div class="balance-card">

<h5>Current Balance</h5>

<h1>$18,450.75</h1>

</div>

</div>

<div class="col-lg-8">

<div class="card custom-card">

<h4 class="mb-4">
Transfer Money
</h4>

<form>

<div class="mb-3">

<label>Recipient Account</label>

<input
type="text"
class="form-control"
placeholder="Account Number">

</div>

<div class="mb-3">

<label>Amount</label>

<input
type="number"
class="form-control"
placeholder="$">

</div>

<div class="mb-3">

<label>Description</label>

<input
type="text"
class="form-control"
placeholder="Optional">

</div>

<button class="btn btn-primary w-100">
Transfer
</button>

</form>

</div>

</div>

</div>

<div class="row mt-5">

<div class="col">

<div class="card custom-card">

<h4 class="mb-4">

Recent Transactions

</h4>

<table class="table table-hover">

<thead>

<tr>

<th>Recipient</th>
<th>Amount</th>
<th>Status</th>

</tr>

</thead>

<tbody>

<tr>

<td>Ali</td>
<td>$150</td>
<td><span class="badge bg-success">Completed</span></td>

</tr>

<tr>

<td>Sara</td>
<td>$200</td>
<td><span class="badge bg-success">Completed</span></td>

</tr>

<tr>

<td>John</td>
<td>$75</td>
<td><span class="badge bg-success">Completed</span></td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
